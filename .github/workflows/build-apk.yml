name: Build y publicar APK

on:
  push:
    branches: [ "claude/supermarket-price-scraper-JZ9cB", "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Cachear debug keystore (firma consistente entre builds)
        id: cache-keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Generar debug keystore si no existe en caché
        if: steps.cache-keystore.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.android
          keytool -genkey -v \
            -keystore ~/.android/debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 36500 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Descargar gradle-wrapper.jar real
        run: |
          curl -L \
            "https://raw.githubusercontent.com/gradle/gradle/v8.6.0/gradle/wrapper/gradle-wrapper.jar" \
            -o gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew

      - name: Aceptar licencias Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Instalar Android SDK 35 y build-tools
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Crear local.properties con SDK path
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Renombrar APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk \
             ComparadorSupermercados.apk

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ComparadorSupermercados-apk
          path: ComparadorSupermercados.apk
          retention-days: 90

      - name: Crear GitHub Release con APK
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v1.0
          name: "Comparador Supermercados v1.0"
          body: |
            ## Comparador de Precios - Supermercados Chilenos

            App Android para comparar precios en **Lider**, **Jumbo** y **Unimarc**.

            ### Como instalar
            1. Descarga `ComparadorSupermercados.apk`
            2. Android: Configuracion > Seguridad > Instalar apps desconocidas
            3. Abre el APK e instala

            Requiere Android 8.0 (API 26) o superior.
          files: ComparadorSupermercados.apk
          fail_on_unmatched_files: true
