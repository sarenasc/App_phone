name: Build y publicar APK

on:
  push:
    branches: [ "claude/supermarket-price-scraper-JZ9cB", "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set ANDROID_HOME (SDK pre-instalado en runner)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV

      - name: Instalar SDK 35 y build-tools
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            --sdk_root="$ANDROID_HOME" 2>/dev/null || \
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            --sdk_root="$ANDROID_HOME" 2>/dev/null || true

      - name: Detectar SDK disponible y ajustar proyecto
        run: |
          SDK=$(ls $ANDROID_HOME/platforms/ | grep "android-" | sort -t- -k2 -n | tail -1 | sed 's/android-//')
          BT=$(ls $ANDROID_HOME/build-tools/ | sort -V | tail -1)
          echo "SDK_VERSION=$SDK" >> $GITHUB_ENV
          echo "BUILD_TOOLS=$BT" >> $GITHUB_ENV
          echo "SDK disponible: $SDK | Build-tools: $BT"
          sed -i "s/compileSdk = [0-9]*/compileSdk = $SDK/" app/build.gradle.kts
          sed -i "s/targetSdk = [0-9]*/targetSdk = $SDK/" app/build.gradle.kts
          cat app/build.gradle.kts | grep -E "compileSdk|targetSdk|minSdk"

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Renombrar APK
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk \
             app/build/outputs/apk/debug/ComparadorSupermercados.apk

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ComparadorSupermercados-apk
          path: app/build/outputs/apk/debug/ComparadorSupermercados.apk
          retention-days: 90

      - name: Crear GitHub Release con APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-debug
          name: "Comparador Supermercados v1.0"
          body: |
            ## Comparador de Precios - Supermercados Chilenos

            App Android para comparar precios en **Líder**, **Jumbo** y **Unimarc** simultáneamente.

            ### Como instalar
            1. Descarga `ComparadorSupermercados.apk`
            2. En tu Android: **Configuracion > Seguridad > Instalar apps desconocidas**
            3. Abre el APK descargado e instala

            ### Requisitos
            - Android 8.0 (API 26) o superior
            - Conexion a internet

            > Build de debug — para uso personal.
          files: app/build/outputs/apk/debug/ComparadorSupermercados.apk
          draft: false
          prerelease: false
          make_latest: true
