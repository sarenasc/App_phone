name: Build y publicar APK

on:
  push:
    branches: [ "claude/supermarket-price-scraper-JZ9cB", "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform 35
        run: |
          yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" 2>/dev/null || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Renombrar APK
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk \
             app/build/outputs/apk/debug/ComparadorSupermercados.apk

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ComparadorSupermercados-apk
          path: app/build/outputs/apk/debug/ComparadorSupermercados.apk
          retention-days: 30

      - name: Crear GitHub Release con APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-debug
          name: "Comparador Supermercados v1.0"
          body: |
            ## Comparador de Precios - Supermercados Chilenos 🛒

            App Android para comparar precios en **Líder**, **Jumbo** y **Unimarc** simultáneamente.

            ### Cómo instalar
            1. Descarga `ComparadorSupermercados.apk`
            2. En tu Android: **Configuración → Seguridad → Instalar apps desconocidas**
            3. Abre el APK descargado e instala

            ### Requisitos
            - Android 8.0 (API 26) o superior
            - Conexión a internet

            > Build de debug — para uso personal.
          files: app/build/outputs/apk/debug/ComparadorSupermercados.apk
          draft: false
          prerelease: false
          make_latest: true
